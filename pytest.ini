[pytest]
# 只收集 tests/ 目录。
# 仓库根目录的 test_api.py 是手动跑的 MinerU 联调脚本，不是单测：它在 import 期就
# 校验 TEST_PDF_PATH 并 sys.exit(1)，被 pytest 收集到会直接 INTERNALERROR、
# 一个测试都跑不了。别人 clone 下来第一件事往往就是敲 pytest，别让他撞这个。
testpaths = tests
# 让直接执行 `pytest` 时，测试也能导入仓库根目录下的模块（如 utils.py）。
pythonpath = .
# 默认跳过需要外网 / 真实生产库的用例（tests/conftest.py 还会在运行期拦截出网与生产库访问）。
#   pytest -m network                                   跑联网冒烟
#   LIT_ALLOW_PROD_READONLY=1 pytest -m prod_readonly   只读核对作者机器上的生产库
addopts = -m "not network and not prod_readonly"
markers =
    network: needs real internet access (OpenAlex/Crossref...); deselected by default
    prod_readonly: reads the real production DB via mode=ro; needs LIT_ALLOW_PROD_READONLY=1; deselected by default
