services:
  literature-analyzer:
    build:
      context: .
      network: host
    container_name: lit_analyzer
    restart: always
    # 与 llm_batch_server/trendradar 同款：宿主机网络，容器内直接用 127.0.0.1 的代理
    # （宿主机防火墙拦截 docker 网桥→宿主机端口，bridge 模式下容器完全断网）
    network_mode: host
    # ── 全局共享 Key 文件 ──
    env_file:
      - /opt/docker_shared/api_keys.env
    environment:
      # ── 项目专属配置 ──
      - TZ=Asia/Shanghai
      - RUN_MODE=batch
      # 及时入库调度（间隔驱动）
      - BATCH_SCAN_INTERVAL_MINUTES=30
      - BATCH_FETCH_INTERVAL_MINUTES=120
      # 教材每日定时入库：凌晨 3 点，每晚最多处理 2000 页 PDF
      - BOOK_INTAKE_TIME=03:00
      - BOOK_DAILY_PAGE_BUDGET=2000
      # 入库成功/已入库的教材原件移到这里，损坏的移到那里。都必须移出 input_books：
      # 留在输入目录的旧书每晚会被重新计一遍页数预算，几本大部头就能吃光当晚额度，
      # 新书永远排不上（2026-07-30 修复的死锁）。
      - BOOK_PROCESSED_DIR=./processed_books
      - BOOK_FAILED_DIR=./failed_books
      # 文档嵌入交给宿主机的夜间任务（crontab 里的 nightly_index.py，0-7 点，08:00 收工）。
      # 容器内 build_index 只报待办不干活：本地 8B 嵌一篇论文约 24 分钟、占 15G 内存，
      # 白天被 batch_fetch（每 120 分钟）触发一次就能把机器占死。
      # 注意 .dockerignore 排除了 .env，容器配置只认这里，改 .env 对容器无效。
      # 重排不受影响，仍走硅基流动在线 API。
      - REVIEW_EMBED_BACKEND=local
      # host 网络下代理直接用宿主机回环地址（覆盖 env_file 里 172.17.0.1 的旧值）。
      # ALL_PROXY 置空：socks5 代理需要 httpx[socks]，镜像里没装，留着会让 openai 客户端初始化崩溃。
      - HTTP_PROXY=http://127.0.0.1:20171
      - HTTPS_PROXY=http://127.0.0.1:20171
      - ALL_PROXY=
      - WEBHOOK_URL=
      # 数据文件路径
      - DB_PATH=./data/batch_tracking.db
      - EXCEL_OUTPUT_PATH=./data/knowledge_base.xlsx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # 所有数据目录统一挂载自 /mnt/ripe/literature_analyzer_data/
      - /mnt/ripe/literature_analyzer_data/input_pdfs:/app/input_pdfs
      - /mnt/ripe/literature_analyzer_data/processed_pdfs:/app/processed_pdfs
      - /mnt/ripe/literature_analyzer_data/failed_pdfs:/app/failed_pdfs
      - /mnt/ripe/literature_analyzer_data/mineru_output:/app/mineru_output
      - /mnt/ripe/literature_analyzer_data/obsidian_磷化工文献:/app/obsidian_vault
      - /mnt/ripe/literature_analyzer_data/input_books:/app/input_books
      - /mnt/ripe/literature_analyzer_data/book_output:/app/book_output
      - /mnt/ripe/literature_analyzer_data/processed_books:/app/processed_books
      - /mnt/ripe/literature_analyzer_data/failed_books:/app/failed_books
      - /mnt/ripe/literature_analyzer_data:/app/data
    # 默认启动常驻守护进程
    command: ["python", "daemon.py"]
