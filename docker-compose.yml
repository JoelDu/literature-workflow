services:
  literature-analyzer:
    build:
      context: .
      network: host
    container_name: lit_analyzer
    restart: always
    # 与 llm_batch_server/trendradar 同款：宿主机网络，容器内直接用 127.0.0.1 的代理
    # （宿主机防火墙拦截 docker 网桥→宿主机端口，bridge 模式下容器完全断网）
    network_mode: host
    # ── 全局共享 Key 文件 ──
    env_file:
      - /opt/docker_shared/api_keys.env
    environment:
      # ── 项目专属配置 ──
      - TZ=Asia/Shanghai
      - RUN_MODE=batch
      # 及时入库调度（间隔驱动）
      - BATCH_SCAN_INTERVAL_MINUTES=30
      - BATCH_FETCH_INTERVAL_MINUTES=120
      # host 网络下代理直接用宿主机回环地址（覆盖 env_file 里 172.17.0.1 的旧值）。
      # ALL_PROXY 置空：socks5 代理需要 httpx[socks]，镜像里没装，留着会让 openai 客户端初始化崩溃。
      - HTTP_PROXY=http://127.0.0.1:20171
      - HTTPS_PROXY=http://127.0.0.1:20171
      - ALL_PROXY=
      - WEBHOOK_URL=
      # 数据文件路径
      - DB_PATH=./data/batch_tracking.db
      - EXCEL_OUTPUT_PATH=./data/knowledge_base.xlsx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # 所有数据目录统一挂载自 /mnt/ripe/literature_analyzer_data/
      - /mnt/ripe/literature_analyzer_data/input_pdfs:/app/input_pdfs
      - /mnt/ripe/literature_analyzer_data/processed_pdfs:/app/processed_pdfs
      - /mnt/ripe/literature_analyzer_data/failed_pdfs:/app/failed_pdfs
      - /mnt/ripe/literature_analyzer_data/mineru_output:/app/mineru_output
      - /mnt/ripe/literature_analyzer_data/obsidian_磷化工文献:/app/obsidian_vault
      - /mnt/ripe/literature_analyzer_data:/app/data
    # 默认启动常驻守护进程
    command: ["python", "daemon.py"]
